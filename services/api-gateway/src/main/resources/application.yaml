spring:
  application:
    name: api-gateway
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 500
            readTimeout: 2000
            loggerLevel: basic
            micrometer.enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true

arenax:
  gateway:
    routes:
      identity-service: lb://identity-service
      tenant-service: lb://tenant-service
      subscription-service: lb://subscription-service
      competition-service: lb://competition-service
  security:
    jwt:
      issuer: arenax-identity
      audience: arenax-api
      public-key-location: ${ARENAX_JWT_PUBLIC_KEY_LOCATION:file:./secrets/identity-public.pem}

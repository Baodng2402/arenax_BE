spring:
  application:
    name: api-gateway
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 500
            readTimeout: 2000
            loggerLevel: basic
            micrometer.enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true

arenax:
  gateway:
    routes:
      identity-service: lb://identity-service
      tenant-service: lb://tenant-service
      subscription-service: lb://subscription-service
  security:
    jwt:
      issuer: arenax-identity
      audience: arenax-api
      jwk-set-uri: ${ARENAX_JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

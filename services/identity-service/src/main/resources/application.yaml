spring:
  application:
    name: identity-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true

arenax:
  security:
    jwt:
      issuer: arenax-identity
      audience: arenax-api
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
      secret: ${ARENAX_JWT_SECRET}

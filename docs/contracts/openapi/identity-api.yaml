openapi: 3.1.0
info:
  title: ArenaX Identity API
  version: 1.0.0
  description: Public authentication API exposed through API Gateway and implemented by identity-service.
servers:
  - url: http://localhost:8080
tags:
  - name: Authentication
  - name: User Profile
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new ArenaX user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered in pending state and verification email requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Reserved for future administrative conflict flows. Public clients still receive a generic response body.
  /api/v1/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify email with one-time token
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified and user activated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: Token expired or already consumed.
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Returns short-lived access token and sets refresh cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly refresh token cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: User temporarily locked due to repeated failed logins.
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue a new access token
      operationId: refresh
      requestBody:
        required: false
      responses:
        '200':
          description: Access token rotated successfully.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: New HttpOnly refresh token cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh session
      operationId: logout
      requestBody:
        required: false
      responses:
        '204':
          description: Current refresh session revoked and cookie cleared.
  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke every refresh session for the authenticated user
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/request-password-reset:
    post:
      tags: [Authentication]
      summary: Start password reset without leaking account existence
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted regardless of whether the email exists.
  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with one-time token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset completed and all sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: Token expired or already consumed.
  /api/v1/users/me:
    get:
      tags: [User Profile]
      summary: Fetch authenticated user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [User Profile]
      summary: Update authenticated user profile basics
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me/username:
    put:
      tags: [User Profile]
      summary: Set or replace the public username handle
      operationId: updateCurrentUsername
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsernameRequest'
      responses:
        '200':
          description: Username updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [User Profile]
      summary: Clear the public username handle
      operationId: clearCurrentUsername
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Username cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me/emails:
    get:
      tags: [User Profile]
      summary: List all email identifiers for the authenticated user
      operationId: listCurrentUserEmails
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ordered email identifiers, primary first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserEmailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [User Profile]
      summary: Add a secondary email identifier and trigger verification
      operationId: addCurrentUserEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEmailRequest'
      responses:
        '201':
          description: Secondary email created in unverified state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEmailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me/emails/{emailId}/primary:
    patch:
      tags: [User Profile]
      summary: Promote a verified email to primary
      operationId: setCurrentUserPrimaryEmail
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: emailId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated profile with the new primary email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me/emails/{emailId}:
    delete:
      tags: [User Profile]
      summary: Remove a non-primary email identifier
      operationId: deleteCurrentUserEmail
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: emailId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Email identifier removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation or token error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          description: Primary email identifier created at registration time.
        password:
          type: string
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          minLength: 1
          maxLength: 120
    RegisterResponse:
      type: object
      required: [userId, email, status]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Primary email captured at registration time.
        status:
          type: string
          enum: [PENDING]
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Verified email identifier used for login.
        password:
          type: string
          minLength: 1
          maxLength: 128
        accountId:
          type: string
          format: uuid
          nullable: true
          description: Optional account context. If omitted, Identity may choose a default account from its local projection.
    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/UserProfileResponse'
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Any verified email identifier owned by the user.
    UpdateProfileRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        avatarUrl:
          type: string
          format: uri
          nullable: true
    UpdateUsernameRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
    UsernameResponse:
      type: object
      required: [username]
      properties:
        username:
          type: string
    AddEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 32
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    UserProfileResponse:
      type: object
      required: [userId, primaryEmail, emails, fullName, status]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
        primaryEmail:
          type: string
          format: email
          description: Current primary email for the user.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/UserEmailResponse'
        fullName:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED, DEACTIVATED]
        avatarUrl:
          type: string
          format: uri
          nullable: true
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        accountId:
          type: string
          format: uuid
          nullable: true
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    UserEmailResponse:
      type: object
      required: [id, email, primary, verified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        primary:
          type: boolean
        verified:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
          nullable: true
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
